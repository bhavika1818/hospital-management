<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CureDash — Doctors</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121933;
      --card: #0f1630;
      --card-2: #111a3a;
      --text: #e8ecff;
      --muted: #a7b0d6;
      --brand: #6aa6ff;
      --brand-2: #87f3ff;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(180deg, var(--bg), var(--bg-soft));
      color: var(--text);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      padding: 40px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      gap: 20px;
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.3rem;
    }

    header img {
      border-radius: 50%;
      width: 50px;
      height: 50px;
      object-fit: cover;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
      padding: 8px 12px;
      border-radius: 8px;
    }
    
    nav a:hover {
      color: var(--brand-2);
      background: rgba(135, 243, 255, 0.1);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-align: center;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      text-align: center;
      align-content: center;
      margin-bottom: 40px;
      font-size: 1.1rem;
      max-width: 600px;
    }

    .grid {
      display: grid;
      gap: 30px;
      max-width: 1200px;
      width: 100%;
      transition: all 0.3s ease;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      padding: 20px 0;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: center;
      padding: 30px 25px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid rgba(106, 166, 255, 0.1);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border-color: rgba(106, 166, 255, 0.3);
    }

    .doctor-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 20px;
      border: 4px solid rgba(106, 166, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .card .name {
      font-weight: 700;
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: var(--text);
    }

    .card .role {
      color: var(--brand-2);
      font-weight: 600;
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .card .muted {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .book-btn {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: var(--bg);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: auto;
      font-family: inherit;
    }

    .book-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(106, 166, 255, 0.4);
    }

    footer {
      margin-top: 80px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 20px;
      width: 100%;
      border-top: 1px solid rgba(167, 176, 214, 0.1);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      body {
        padding: 20px 15px;
      }
      
      header {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }
      
      nav ul {
        justify-content: center;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .card {
        padding: 25px 20px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 10px;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
      
      nav ul {
        gap: 10px;
      }
      
      nav a {
        padding: 6px 10px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="logoo.jpg" alt="CureDash Logo" width="50" height="50">
      <span>CureDash</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="department.html">Departments</a></li>
        <li><a href="appointment.html">Appointment</a></li>
        <li><a href="#" style="color: var(--brand-2);">Doctors</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Meet Our Expert Doctors</h1>
    
    <section class="grid" id="doctorsGrid">
      <!-- Doctor cards will be injected via JavaScript -->
    </section>
  </main>

  <footer>
    © <span id="year">2025</span> CureDash Health Pvt. Ltd. — All Rights Reserved.
  </footer>

  <script>
    // Enhanced Doctors Data with placeholder images
    const pageData = {
      doctors: [
        {
          name: "Dr. Krish Sharma",
          role: "Cardiologist • MD, DM",
          info: "7+ years experience in coronary interventions and cardiac care. Specialized in angioplasty and heart failure management.",
          image: "https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=400&h=400&fit=crop&crop=face"
        },
        {
          name: "Dr. Anya Mehta",
          role: "Orthopedic Surgeon • MS, MCh",
          info: "Specialist in joint replacements, sports injuries, and arthroscopic surgery. Committed to restoring mobility and quality of life.",
          image: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=400&h=400&fit=crop&crop=face"
        },
        {
          name: "Dr. Rudra Rathore",
          role: "Neurologist • MD, DM",
          info: "Expert in epilepsy, stroke, and movement disorders. Pioneering treatments in neurological care with 10+ years of experience.",
          image: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=400&h=400&fit=crop&crop=face"
        },
        {
          name: "Dr. Simran Kaur",
          role: "Oncologist • MD, DM",
          info: "Focused on precision chemotherapy and comprehensive cancer care. Dedicated to personalized treatment approaches.",
          image: "simran.jpg"
        },
        {
          name: "Dr. Rohan Mehta",
          role: "Pediatrician • MD",
          info: "Child health and neonatal intensive care specialist. Passionate about preventive care and childhood development.",
          image: "https://images.unsplash.com/photo-1582750433449-648ed127bb54?w=400&h=400&fit=crop&crop=face"
        },
        {
          name: "Dr. Aisha Patel",
          role: "Dermatologist • MD",
          info: "Expert in cosmetic dermatology and skin therapy. Specializing in advanced skincare treatments and dermatological surgery.",
          image: "aisha.jpg"
        }
      ]
    };

    // Function to generate doctor cards
    function renderDoctors() {
      const grid = document.getElementById("doctorsGrid");
      grid.innerHTML = "";
      
      pageData.doctors.forEach(doc => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${doc.image}" alt="Portrait of ${doc.name}" class="doctor-img">
          <div class="name">${doc.name}</div>
          <div class="role">${doc.role}</div>
          <p class="muted">${doc.info}</p>
          <button class="book-btn" onclick="bookAppointment('${doc.name}')">Book Appointment</button>
        `;
        grid.appendChild(card);
      });
    }

    // Book appointment function
    function bookAppointment(doctorName) {
      // Store selected doctor in localStorage and redirect to appointment page
      localStorage.setItem('selectedDoctor', doctorName);
      window.location.href = 'appointment.html';
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      renderDoctors();
      document.getElementById("year").textContent = new Date().getFullYear();
    });

    // Responsive layout (simplified)
    function handleResize() {
      const grid = document.getElementById("doctorsGrid");
      const width = window.innerWidth;
      
      if (width <= 480) {
        document.body.style.padding = "15px 10px";
      } else if (width <= 768) {
        document.body.style.padding = "20px 15px";
      } else {
        document.body.style.padding = "40px 20px";
      }
    }

    window.addEventListener("resize", handleResize);
    handleResize(); // Initial call
  </script>
</body>
</html>
