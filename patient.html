<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CureDash — Patient Records</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121933;
      --card: #0f1630;
      --card-2: #111a3a;
      --text: #e8ecff;
      --muted: #a7b0d6;
      --brand: #6aa6ff;
      --brand-2: #87f3ff;
      --accent: #85ffa7;
      --danger: #ff7a7a;
      --warning: #ffd36a;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }

    body {
      background: linear-gradient(180deg, var(--bg), var(--bg-soft));
      color: var(--text);
      font-family: "Inter", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      padding: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 40px;
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.3rem;
    }

    header img {
      border-radius: 50%;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 18px;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: var(--brand-2);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }

    .search-bar {
      background: var(--card-2);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .search-bar input {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 1rem;
      flex-grow: 1;
      min-width: 250px;
    }

    .search-bar button {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #001028;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .search-bar button:hover {
      transform: translateY(-2px);
    }

    .table-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      overflow-x: auto;
      max-width: 1100px;
      width: 100%;
      transition: all 0.4s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      color: var(--text);
      min-width: 800px;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      white-space: nowrap;
    }

    th {
      color: var(--brand-2);
      font-weight: 600;
      background: rgba(255,255,255,.05);
    }

    tr:hover td {
      background: rgba(255,255,255,.05);
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-active {
      background: rgba(133, 255, 167, 0.2);
      color: var(--accent);
    }
    .status-inactive {
      background: rgba(255, 122, 122, 0.2);
      color: var(--danger);
    }

    .action-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.2);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      margin-right: 5px;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: rgba(255,255,255,.1);
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      .search-bar {
        flex-direction: column;
        align-items: stretch;
      }
      .search-bar input {
        min-width: auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="logoo.jpg" alt="CureDash Logo" width="50" height="50">
      <span>CureDash</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="patient-records.html" class="active">Patient Records</a></li>
        <li><a href="billing.html">Billing</a></li>
        <li><a href="lab-results.html">Lab Results</a></li>
        <li><a href="pharmacy.html">Pharmacy</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Patient Records</h1>
    
    <section class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by patient name, ID, or contact...">
      <button id="searchBtn">Search</button>
    </section>
    
    <section class="table-card">
      <table id="patientTable">
        <thead>
          <tr>
            <th>Patient ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Contact</th>
            <th>Last Visit</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="patientTableBody">
          <!-- Patient data will be populated by JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    © <span id="year">2025</span> CureDash Health Pvt. Ltd. — All Rights Reserved.
  </footer>

  <script>
    // Patient Records Data
    const patientRecords = {
      patients: [
        {
          id: "P001",
          name: "Rahul Sharma",
          age: 45,
          gender: "Male",
          contact: "+91 98765-43210",
          lastVisit: "2025-03-15",
          status: "Active"
        },
        {
          id: "P002",
          name: "Priya Patel",
          age: 32,
          gender: "Female",
          contact: "+91 98765-43211",
          lastVisit: "2025-03-10",
          status: "Active"
        },
        {
          id: "P003",
          name: "Amit Kumar",
          age: 58,
          gender: "Male",
          contact: "+91 98765-43212",
          lastVisit: "2025-02-28",
          status: "Inactive"
        },
        {
          id: "P004",
          name: "Sneha Reddy",
          age: 29,
          gender: "Female",
          contact: "+91 98765-43213",
          lastVisit: "2025-03-18",
          status: "Active"
        },
        {
          id: "P005",
          name: "Vikram Singh",
          age: 67,
          gender: "Male",
          contact: "+91 98765-43214",
          lastVisit: "2025-03-05",
          status: "Active"
        },
        {
          id: "P006",
          name: "Anjali Mehta",
          age: 41,
          gender: "Female",
          contact: "+91 98765-43215",
          lastVisit: "2025-02-20",
          status: "Inactive"
        }
      ]
    };

    // Function to render patient table
    function renderPatientTable(patients = patientRecords.patients) {
      const tbody = document.getElementById("patientTableBody");
      tbody.innerHTML = "";
      
      patients.forEach(patient => {
        const row = document.createElement("tr");
        const statusClass = patient.status === "Active" ? "status-active" : "status-inactive";
        
        row.innerHTML = `
          <td>${patient.id}</td>
          <td>${patient.name}</td>
          <td>${patient.age}</td>
          <td>${patient.gender}</td>
          <td>${patient.contact}</td>
          <td>${patient.lastVisit}</td>
          <td><span class="status-badge ${statusClass}">${patient.status}</span></td>
          <td>
            <button class="action-btn" onclick="viewPatient('${patient.id}')">View</button>
            <button class="action-btn" onclick="editPatient('${patient.id}')">Edit</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Search functionality
    function searchPatients() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const filteredPatients = patientRecords.patients.filter(patient => 
        patient.name.toLowerCase().includes(searchTerm) ||
        patient.id.toLowerCase().includes(searchTerm) ||
        patient.contact.includes(searchTerm)
      );
      renderPatientTable(filteredPatients);
    }

    // Placeholder functions for actions
    function viewPatient(id) {
      alert(`Viewing details for patient ID: ${id}`);
      // In a real application, this would navigate to a detailed view
    }

    function editPatient(id) {
      alert(`Editing patient record for ID: ${id}`);
      // In a real application, this would open an edit form
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", function() {
      renderPatientTable();
      document.getElementById("searchBtn").addEventListener("click", searchPatients);
      document.getElementById("searchInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
          searchPatients();
        }
      });
      document.getElementById("year").textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
