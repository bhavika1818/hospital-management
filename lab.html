<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CureDash — Lab Results</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121933;
      --card: #0f1630;
      --card-2: #111a3a;
      --text: #e8ecff;
      --muted: #a7b0d6;
      --brand: #6aa6ff;
      --brand-2: #87f3ff;
      --accent: #85ffa7;
      --danger: #ff7a7a;
      --warning: #ffd36a;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 16px;
    }

    body {
      background: linear-gradient(180deg, var(--bg), var(--bg-soft));
      color: var(--text);
      font-family: "Inter", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      padding: 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 40px;
    }

    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.3rem;
    }

    header img {
      border-radius: 50%;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 18px;
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: var(--brand-2);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }

    .filter-bar {
      background: var(--card-2);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .filter-bar select, .filter-bar input {
      background: var(--card);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 1rem;
    }

    .filter-bar button {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #001028;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .filter-bar button:hover {
      transform: translateY(-2px);
    }

    .table-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      overflow-x: auto;
      max-width: 1100px;
      width: 100%;
      transition: all 0.4s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      color: var(--text);
      min-width: 800px;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    th {
      color: var(--brand-2);
      font-weight: 600;
      background: rgba(255,255,255,.05);
    }

    tr:hover td {
      background: rgba(255,255,255,.05);
    }

    .status-badge {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-completed {
      background: rgba(133, 255, 167, 0.2);
      color: var(--accent);
    }
    .status-pending {
      background: rgba(255, 211, 106, 0.2);
      color: var(--warning);
    }
    .status-critical {
      background: rgba(255, 122, 122, 0.2);
      color: var(--danger);
    }

    .action-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.2);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      margin-right: 5px;
      transition: all 0.2s ease;
    }
    .action-btn:hover {
      background: rgba(255,255,255,.1);
    }

    footer {
      margin-top: 60px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px;
      }
      .filter-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">
      <img src="logoo.jpg" alt="CureDash Logo" width="50" height="50">
      <span>CureDash</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="patient-records.html">Patient Records</a></li>
        <li><a href="billing.html">Billing</a></li>
        <li><a href="lab-results.html" class="active">Lab Results</a></li>
        <li><a href="pharmacy.html">Pharmacy</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Laboratory Results</h1>
    
    <section class="filter-bar">
      <select id="statusFilter">
        <option value="all">All Status</option>
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
        <option value="critical">Critical</option>
      </select>
      <input type="text" id="searchInput" placeholder="Search by patient name or test...">
      <button id="searchBtn">Search</button>
    </section>
    
    <section class="table-card">
      <table id="labTable">
        <thead>
          <tr>
            <th>Test ID</th>
            <th>Patient</th>
            <th>Test Type</th>
            <th>Ordered Date</th>
            <th>Completed Date</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="labTableBody">
          <!-- Lab data will be populated by JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    © <span id="year">2025</span> CureDash Health Pvt. Ltd. — All Rights Reserved.
  </footer>

  <script>
    // Lab Results Data
    const labResults = {
      tests: [
        {
          id: "LAB001",
          patient: "Rahul Sharma",
          testType: "Blood Test - CBC",
          orderedDate: "2025-03-15",
          completedDate: "2025-03-15",
          status: "Completed"
        },
        {
          id: "LAB002",
          patient: "Priya Patel",
          testType: "Urine Analysis",
          orderedDate: "2025-03-10",
          completedDate: "2025-03-11",
          status: "Completed"
        },
        {
          id: "LAB003",
          patient: "Amit Kumar",
          testType: "Lipid Profile",
          orderedDate: "2025-02-28",
          completedDate: "",
          status: "Pending"
        },
        {
          id: "LAB004",
          patient: "Sneha Reddy",
          testType: "Thyroid Function Test",
          orderedDate: "2025-03-18",
          completedDate: "2025-03-18",
          status: "Completed"
        },
        {
          id: "LAB005",
          patient: "Vikram Singh",
          testType: "Liver Function Test",
          orderedDate: "2025-03-05",
          completedDate: "2025-03-06",
          status: "Critical"
        },
        {
          id: "LAB006",
          patient: "Anjali Mehta",
          testType: "Blood Glucose",
          orderedDate: "2025-02-20",
          completedDate: "",
          status: "Pending"
        }
      ]
    };

    // Function to render lab table
    function renderLabTable(tests = labResults.tests) {
      const tbody = document.getElementById("labTableBody");
      tbody.innerHTML = "";
      
      tests.forEach(test => {
        const row = document.createElement("tr");
        let statusClass = "";
        if (test.status === "Completed") statusClass = "status-completed";
        else if (test.status === "Pending") statusClass = "status-pending";
        else if (test.status === "Critical") statusClass = "status-critical";
        
        row.innerHTML = `
          <td>${test.id}</td>
          <td>${test.patient}</td>
          <td>${test.testType}</td>
          <td>${test.orderedDate}</td>
          <td>${test.completedDate || "-"}</td>
          <td><span class="status-badge ${statusClass}">${test.status}</span></td>
          <td>
            <button class="action-btn" onclick="viewResults('${test.id}')">View</button>
            <button class="action-btn" onclick="downloadReport('${test.id}')">Download</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Search and filter functionality
    function filterTests() {
      const statusFilter = document.getElementById("statusFilter").value;
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      
      let filteredTests = labResults.tests;
      
      // Apply status filter
      if (statusFilter !== "all") {
        filteredTests = filteredTests.filter(test => 
          test.status.toLowerCase() === statusFilter.toLowerCase()
        );
      }
      
      // Apply search filter
      if (searchTerm) {
        filteredTests = filteredTests.filter(test => 
          test.patient.toLowerCase().includes(searchTerm) ||
          test.testType.toLowerCase().includes(searchTerm) ||
          test.id.toLowerCase().includes(searchTerm)
        );
      }
      
      renderLabTable(filteredTests);
    }

    // Placeholder functions for actions
    function viewResults(id) {
      alert(`Viewing lab results for test ID: ${id}`);
      // In a real application, this would show detailed test results
    }

    function downloadReport(id) {
      alert(`Downloading lab report for test ID: ${id}`);
      // In a real application, this would generate and download PDF report
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", function() {
      renderLabTable();
      document.getElementById("searchBtn").addEventListener("click", filterTests);
      document.getElementById("statusFilter").addEventListener("change", filterTests);
      document.getElementById("searchInput").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
          filterTests();
        }
      });
      document.getElementById("year").textContent = new Date().getFullYear();
    });
  </script>
</body>
</html>
