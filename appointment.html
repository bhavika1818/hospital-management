            </div>
            <div class="field">

              <select id="doctor" name="doctor">

                <option value="dr-anya-mehta">Dr. Anya Mehta</option>
                <option value="dr-rudra-rathore">Dr. Rudra Rathore</option>
                <option value="dr-simran-kaur">Dr. Simran Kaur</option>

            </div>
          </div>
          
          <div class="form-row">

            <div class="field">
